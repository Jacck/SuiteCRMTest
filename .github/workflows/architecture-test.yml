name: Architecture Tests
on: [push, pull_request]

jobs:
  architecture-analysis:
    name: Architecture Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          
      - name: Install tools
        run: |
          composer require --dev phpmetrics/phpmetrics
          composer require --dev pdepend/pdepend

      - name: Generate Metrics
        run: |
          vendor/bin/phpmetrics --report-html=metrics-report ./modules
          
      - name: Check Coupling Metrics
        run: |
          vendor/bin/pdepend \
            --summary-xml=pdepend.xml \
            --overview-pyramid=pyramid.svg \
            --jdepend-chart=jdepend.svg \
            --jdepend-xml=jdepend.xml \
            --ignore=tests,vendor \
            ./
          php scripts/check-metrics.php pdepend.xml

      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: architecture-analysis
          path: |
            metrics-report/
            pdepend.xml
            pyramid.svg
            jdepend.svg
            jdepend.xml
